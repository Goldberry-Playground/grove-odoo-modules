# Agent-mergeable path for grove-odoo-modules
# (GOL-308 port of grove-sites GOL-122; direct-merge + bot-thread handling under GOL-644).
#
# Problem this solves:
#   Every Paperclip agent authors PRs under the SAME GitHub App bot
#   (agenticos-developer[bot]). This repo's `main-branch-protection` ruleset
#   requires 1 approving review, and GitHub blocks "approve your own pull
#   request", so no agent can satisfy the review gate on its own PRs.
#
# What actually stalled GOL-642 S1 (#27) -- and the durable fix (GOL-644):
#   The approval identity was NOT the blocker: prior agent PRs (#19/#20/#26)
#   merged with only a github-actions[bot] approval, so that approval DOES
#   satisfy the ruleset here. #27 was blocked by an UNRESOLVED review thread
#   from the third-party `github-code-quality` App (installed on this repo but
#   NOT on grove-sites). The ruleset sets `required_review_thread_resolution:
#   true`, so a single advisory bot nitpick permanently BLOCKS an agent PR even
#   when every required status check is green -- and `--auto` merge waits for it
#   forever. We resolve ONLY github-code-quality threads; human review threads
#   are left unresolved so human review is still preserved and still blocks.
#
# How it works (mirrors grove-sites' proven merge mechanism):
#   - APPROVE as github-actions[bot] -- a DISTINCT identity from the PR-author
#     App -- which satisfies the required review. (Org+repo setting "Allow
#     GitHub Actions to create and approve pull requests" enabled in GOL-304.)
#   - RESOLVE stale github-code-quality review threads (advisory nitpicks; the
#     required status checks are the real gate).
#   - ENABLE auto-merge (squash) as github-actions[bot] and let the branch's
#     `merge-queue` ruleset own the actual squash-merge. We NEVER pass
#     `--delete-branch`: the repo's `delete_branch_on_merge=true` deletes the
#     head ref AFTER the queue merges. Passing `--delete-branch` deletes the head
#     ref BEFORE the queue completes -> the queued merge is cancelled and the PR
#     is CLOSED unmerged (this is exactly what silently dropped #93; GOL-1658).
#     The poll loop keeps re-resolving any late-arriving code-quality thread so
#     the queue is never blocked. Requires `contents: write` + "Allow auto-merge".
#
# Human-maintainer path (GOL-1854, port of odoocker GOL-1195):
#   A maintainer's OWN PRs hit the same wall from the other side: the ruleset
#   requires an approving review, GitHub blocks approving your own PR, and (until
#   now) this workflow skipped ALL human authors -> the maintainer's PR dead-ended
#   with no way to satisfy the gate. The old workaround was to RE-ORIGINATE the PR
#   under the agent App so it became bot-authored (GOL-1815 toil). We now clear the
#   review gate for a small allowlist of trusted human maintainers (MAINTAINERS)
#   by approving as github-actions[bot] (a DISTINCT identity, so no self-approval),
#   but we deliberately DO NOT enable auto-merge for them -> the human keeps full
#   control over WHEN their PR merges. The protected-paths carve-out applies to
#   maintainer PRs too; only the agent-review sign-off gate is skipped for them
#   (a human reviews their PR by hand). CI + protected-paths-guard +
#   required_review_thread_resolution still gate the actual merge.
#
# Guardrails (see GOL-122 / GOL-644 / GOL-1854):
#   - Auto-approves only (a) the agent App bot's PRs and (b) an explicit
#     human-maintainer allowlist (MAINTAINERS). All other human/external PRs
#     still keep the normal human-review requirement.
#   - Only fires AFTER CI (all required status checks) SUCCEEDED
#     -> not a blanket rubber-stamp; functional gates still hold.
#   - Only resolves github-code-quality threads, never human threads.
#   - Agent PRs get approve + auto-merge; maintainer PRs get approve ONLY
#     (no auto-merge) so the human decides when to merge.
#   - Runs from the base-branch definition (workflow_run), so a PR cannot
#     modify this file to approve itself.
name: Auto-approve verified agent PRs

on:
  # GOL-1938: three entrypoints, ALL evaluated from the BASE-branch workflow
  # definition. workflow_run / check_run / pull_request_review each run the
  # default-branch copy of this file, never a PR-supplied one, so the "a PR
  # cannot edit this workflow to approve itself" property is preserved.
  #   - workflow_run:         CI finished (the original trigger).
  #   - check_run:            an agent-review/* check flipped to success AFTER CI
  #                           had already finished — the case that used to stall
  #                           forever because nothing re-fired the workflow.
  #   - pull_request_review:  a human maintainer submitted an approving review —
  #                           enqueues without waiting for a fresh push.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  check_run:
    types: [completed]
  pull_request_review:
    types: [submitted]

# contents:write lets github-actions[bot] perform the direct squash merge;
# pull-requests:write lets it post the approving review and resolve threads.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve:
    # GOL-1938: gate hard at the job level so (a) high-volume check_run events
    # that are NOT an agent-review/* success never start a runner [acceptance
    # #3], and (b) the bot's OWN approving review never re-triggers this
    # workflow [acceptance #4].
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0] != null) ||
      (github.event_name == 'check_run' &&
       github.event.check_run.conclusion == 'success' &&
       startsWith(github.event.check_run.name, 'agent-review/')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.review.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      # GOL-1406-A: base-branch checkout so the Tier-0 carve-out below runs the
      # base definition of scripts/ci/protected-paths-carveout.mjs, not a
      # PR-supplied one (a PR cannot edit the carve-out to approve itself).
      - name: Check out base-branch scripts (protected-paths carve-out)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      # GOL-1938: the target PR is carried differently by each trigger. Resolve
      # it once here and hand it to the shared gate body below via $GITHUB_ENV,
      # so the entrypoints share the gate instead of copy-pasting it.
      - name: Resolve target PR number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WR_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          CR_PR: ${{ github.event.check_run.pull_requests[0].number }}
          CR_SHA: ${{ github.event.check_run.head_sha }}
        run: |
          set -euo pipefail
          PR=""
          case "$EVENT_NAME" in
            workflow_run)        PR="$WR_PR" ;;
            pull_request_review) PR="$REVIEW_PR" ;;
            check_run)
              # check_run carries PR context in .pull_requests[], but that array
              # can be EMPTY (App-created check-runs, or a fork PR). Fall back to
              # a head-SHA -> open-PR lookup so those still resolve. (GOL-1938)
              PR="$CR_PR"
              if [ -z "$PR" ] || [ "$PR" = "null" ]; then
                PR=$(gh api "repos/$REPO/commits/$CR_SHA/pulls" \
                  --jq '[.[] | select(.state=="open")][0].number' 2>/dev/null || true)
              fi
              ;;
          esac
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open target PR resolved for event '$EVENT_NAME'; nothing to do."
            PR=""
          else
            echo "Resolved target PR #$PR (event: $EVENT_NAME)."
          fi
          echo "PR=${PR}" >> "$GITHUB_ENV"

      - name: Approve + resolve bot threads + merge (github-actions[bot])
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # PR is resolved by the previous step. Empty when the event
          # carried no actionable PR (e.g. a check_run whose head SHA
          # has no open PR); nothing to do in that case. (GOL-1938)
          if [ -z "${PR:-}" ]; then
            echo "No target PR to process; exiting."
            exit 0
          fi

          # Trusted human maintainers whose OWN PRs may auto-clear the review
          # gate (space-separated logins). GitHub blocks approving your own PR,
          # so without this a maintainer's PR dead-ends — previously worked around
          # by re-originating the PR under the agent App (GOL-1815 toil). Keep this
          # list minimal and in sync with the protected-paths owner. (GOL-1854)
          MAINTAINERS="EngineeringMoonBear"

          AUTHOR=$(gh pr view "$PR" --repo "$REPO" --json author -q '.author.login')
          # App bot logins appear as "app/agenticos-developer" via gh and
          # "agenticos-developer" via some APIs; accept both.
          KIND=""
          case "$AUTHOR" in
            app/agenticos-developer|agenticos-developer) KIND="agent" ;;
          esac
          if [ -z "$KIND" ]; then
            for m in $MAINTAINERS; do
              # Match a bare login ONLY. Reject the "app/$m" form: real human
              # maintainers always appear as bare logins, never "app/<login>".
              # (GOL-1372 / GOL-1322)
              if [ "$AUTHOR" = "$m" ]; then KIND="maintainer"; break; fi
            done
          fi
          if [ -z "$KIND" ]; then
            echo "PR #$PR author '$AUTHOR' is not the agent App bot or a listed maintainer; skipping (human/external PRs keep human review)."
            exit 0
          fi
          echo "PR #$PR author '$AUTHOR' classified as: $KIND"

          # Both gates apply — they answer different questions and neither
          # subsumes the other: the carve-out asks "does this touch a dangerous
          # file?", the agent-review gate asks "did a reviewer sign off on THIS
          # head SHA?". A PR can fail either independently, so both stay.
          #
          # ORDER IS DELIBERATE: the carve-out is one API call + a local script,
          # while the agent-review gate polls for up to 15 minutes. Running the
          # cheap fail-closed check FIRST means a protected-path PR exits at once
          # instead of burning a quarter hour of runner time to reach the same
          # verdict.
          # ── Tier-0 protected-paths carve-out (GOL-1406-A) ──
          # Defense-in-depth before the protected-paths-guard becomes a REQUIRED
          # check: never auto-approve/merge an agent PR that touches a protected
          # path. Same PROTECTED_GLOBS as protected-paths-guard.yml (both
          # generated from AgenticOS scripts/ci/gen-protected-paths-guard.py, so
          # they cannot drift). Fail-closed: if the check cannot run, withhold.
          PR_FILES=$(gh pr view "$PR" --repo "$REPO" --json files -q '.files[].path')
          if REASON=$(PR_FILES="$PR_FILES" node scripts/ci/protected-paths-carveout.mjs); then
            :  # no protected path touched — proceed to approve
          else
            echo "PR #$PR not auto-approved: $REASON"
            exit 0
          fi

          # ── Unified agent-review gate (GOL-1734 / GOL-1738, Ada sign-off) ──
          # AGENT PRs only. Maintainer PRs are exempt — a human reviews them by
          # hand; the review-count gate is cleared by the github-actions[bot]
          # approval below. The carve-out above still applied to both. (GOL-1854)
          if [ "$KIND" = "agent" ]; then
          # The github-sync plugin emits exactly one `agent-review/<reviewer>`
          # check-run per non-draft agent PR: seeded `in_progress` on open,
          # flipped to `success` ON THAT HEAD SHA only when the reviewer signs
          # the review issue `done`. COMMENT-only — the signal is a check-run,
          # never a GitHub APPROVE event. Require it PRESENT and `success` on the
          # CURRENT head SHA before approving/merging: absent / in_progress /
          # neutral / failure / success-on-old-SHA => BLOCK. Native `--auto`
          # merge only waits for REQUIRED checks, and agent-review/* is not a
          # required check, so this explicit gate is what enforces review here.
          # Poll so a sign-off landing shortly after CI is caught; a later
          # sign-off re-fires on the next CI run.
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q '.headRefOid')
          REVIEW_STATE=absent
          for i in $(seq 1 30); do   # up to ~15 min (30 × 30s)
            REVIEW_STATE=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              -q '[.check_runs[] | select(.name | startswith("agent-review/"))]
                   | if length==0 then "absent"
                     elif any(.[]; .status=="completed" and .conclusion=="success") then "success"
                     elif all(.[]; .status=="completed") then "completed-not-success"
                     else "pending" end')
            case "$REVIEW_STATE" in
              success|completed-not-success) break ;;
            esac
            echo "agent-review/* on $HEAD_SHA: $REVIEW_STATE (poll $i/30)…"
            sleep 30
          done
          if [ "$REVIEW_STATE" != "success" ]; then
            echo "PR #$PR agent-review/* gate not satisfied on $HEAD_SHA (state: $REVIEW_STATE); not approving. The reviewer must sign off (COMMENT-only gate — GOL-1734)."
            exit 0
          fi
          echo "agent-review/* is success on $HEAD_SHA; proceeding."
          fi

          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"

          # Resolve any UNRESOLVED review threads opened by github-code-quality.
          # These are advisory nitpicks; the required status checks are the real
          # gate. Human review threads are intentionally left untouched so they
          # still block the merge (required_review_thread_resolution=true).
          # GraphQL returns bot logins WITHOUT the "[bot]" suffix; match both.
          resolve_bot_threads() {
            # shellcheck disable=SC2016  # $owner/$name/$pr are GraphQL variables, not shell expansions
            gh api graphql \
              -f query='query($owner:String!,$name:String!,$pr:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$pr){
                    reviewThreads(first:100){nodes{
                      id isResolved
                      comments(first:1){nodes{author{login}}}
                    }}
                  }
                }
              }' \
              -f owner="$OWNER" -f name="$NAME" -F pr="$PR" \
              --jq '.data.repository.pullRequest.reviewThreads.nodes[]
                    | select(.isResolved==false)
                    | select((.comments.nodes[0].author.login=="github-code-quality")
                             or (.comments.nodes[0].author.login=="github-code-quality[bot]"))
                    | .id' \
            | while read -r TID; do
                [ -n "$TID" ] || continue
                echo "Resolving stale github-code-quality thread $TID"
                # shellcheck disable=SC2016  # $id is a GraphQL variable, not a shell expansion
                gh api graphql \
                  -f query='mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{isResolved}}}' \
                  -f id="$TID" >/dev/null
              done
          }

          # Approve once (don't stack duplicate approvals on re-runs).
          ALREADY=$(gh api "repos/$REPO/pulls/$PR/reviews" \
            -q '[.[] | select(.user.login=="github-actions[bot]" and .state=="APPROVED")] | length')
          if [ "${ALREADY:-0}" -gt 0 ]; then
            echo "PR #$PR already approved by github-actions[bot]."
          else
            gh pr review "$PR" --repo "$REPO" --approve --body \
              "Auto-approved by github-actions[bot]: CI (all required status checks) passed. This identity is distinct from the PR author, so it satisfies the review requirement without self-approval. Functional required status checks (incl. protected-paths-guard) still gate the merge. (GOL-308 / GOL-644 / GOL-1854)"
          fi

          # Maintainer PRs: approve ONLY. The human decides WHEN to merge, so we
          # do not enable auto-merge on their behalf. We resolve advisory
          # github-code-quality threads once so the human's merge isn't wedged on
          # a bot nitpick; CI, protected-paths-guard, and required human review
          # threads still gate. (GOL-1854)
          if [ "$KIND" = "maintainer" ]; then
            resolve_bot_threads
            echo "PR #$PR is a maintainer PR: review gate cleared; leaving the merge decision to the author."
            exit 0
          fi

          # Enable auto-merge (squash) and let the `merge-queue` ruleset own the
          # actual merge. Poll to re-resolve any late-arriving code-quality thread
          # so the queue is never blocked, and to exit promptly once merged.
          #
          # NEVER pass --delete-branch here: on a merge-queue branch `gh pr merge`
          # enqueues the PR, and deleting the head ref cancels that queued merge
          # and CLOSES the PR unmerged (GOL-1658). Cleanup is automatic --
          # delete_branch_on_merge=true removes the head ref AFTER the queue merges.
          for i in $(seq 1 30); do
            resolve_bot_threads
            MS=$(gh pr view "$PR" --repo "$REPO" --json state,mergeStateStatus -q '.state + ":" + .mergeStateStatus')
            echo "merge attempt $i -- $MS"
            case "$MS" in
              MERGED:*)
                echo "PR #$PR merged."; exit 0 ;;
              OPEN:*)
                # Idempotent: re-enabling auto-merge once it is set is a no-op.
                if gh pr merge "$PR" --repo "$REPO" --squash --auto; then
                  echo "Auto-merge enabled for PR #$PR; the merge queue will squash-merge once required checks are green and threads resolved (head ref auto-deleted post-merge)."
                else
                  echo "Could not enable auto-merge this pass (state $MS); will retry."
                fi ;;
            esac
            sleep 20
          done
          echo "PR #$PR not merged within timeout; auto-merge is enabled and the approval stands, so the merge queue will complete it once required checks are green and all human review threads are resolved (or a maintainer can one-click)."
