name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  # GOL-2114: the daily rates PR (rate-check.yml -> chore/rate-check) is pushed
  # and opened with the default GITHUB_TOKEN, so GitHub's anti-recursion guard
  # never fires the `on: pull_request` run for it -- the five required contexts
  # (Lint Python, Validate Module Manifests, Validate Tenant Slug Map,
  # Pure-Python unit tests, Install + test module against Odoo 19) sit at
  # `action_required` and the PR wedges at "Expected -- waiting for status".
  # rate-check.yml re-dispatches THIS workflow at the branch ref
  # (`gh workflow run ci.yml --ref chore/rate-check`) so every required context
  # reports a real check-run at the PR head SHA. `workflow_dispatch` is the
  # documented exception to the GITHUB_TOKEN suppression rule, and it is
  # dispatchable only because this trigger lives on the default branch. Every
  # job here is a read-only validator/linter/test -- there is no deploy or
  # publish job -- so running them on a manual dispatch is safe. Same pattern as
  # odoocker-goldberrygrove GOL-2504 (#728 / #2519).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Audit 2026-06-29 cross-repo top item #4: catches workflow injection
  # + shell-quoting bugs across all .github/workflows/*.yml files. Cheap.
  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # Audit 2026-06-29 — this repo had NO secret scanner. Repo holds custom
  # Odoo Python that may accumulate credentials over time. trufflehog
  # verifies hits to reduce false positives. Fast (~10s on a small repo).
  secrets-scan:
    name: trufflehog (verified)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # full history — trufflehog scans across commits
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@a05cf0859455b5b16317ee22d809887a4043cdf0 # v3.83.6
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          # --exclude-detectors=Lob: Grove has NO Lob (direct-mail API)
          # integration anywhere, so every "Lob" hit is definitionally a false
          # positive. The Lob detector's loose `test_*` pattern + permissive
          # test-mode verification makes it "verify" our pytest function names
          # (e.g. `test_no_box_triggers_additional_handling`). This flipped
          # `main` red with no code change when the action's bundled scanner
          # (pinned action SHA still runs the `latest` engine image) bumped to
          # 3.96.0 — see GOL-1257. Excluding one unused detector keeps full
          # coverage for services we DO use (Stripe/Square/Mailgun/Ghost).
          extra_args: --only-verified --exclude-detectors=Lob

  # Audit 2026-06-29 — this repo had no Python CVE coverage. requirements-ci.txt
  # exists; scan it for known vulnerabilities at PR time.
  pip-audit:
    name: pip-audit (CVE scan)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit --requirement requirements-ci.txt --strict
        # --strict fails on warnings as well as errors

  no-tracked-env-files:
    name: Reject tracked .env files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Single source of truth against the "real .env got committed" leak class.
      # Operator-owned .env files (.env, .env.local, .env.production, .env.grove,
      # .env.monitoring) MUST never appear in git history. Example/template files
      # are allowed (.env.example, .env.*.example, .env.grove.example, etc).
      - name: Fail if a real .env is tracked
        run: |
          tracked=$(git ls-files | grep -E "^(\.env|.*\.env)$" | grep -vE "\.example$" || true)
          if [ -n "$tracked" ]; then
            echo "::error::Real .env file(s) are tracked. Move them to .env.*.example or rotate the secrets:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked .env (non-example) files."

  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install ruff
        run: pip install -r requirements-ci.txt
      - name: Ruff check
        run: ruff check . --select E,F,I --line-length 120
      - name: Ruff format check
        run: ruff format --check . --line-length 120

  pytest:
    name: Pure-Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test dependencies
        run: pip install requests ruff pytest
      - name: Run pytest
        # scripts/tests/ holds the pure tests for the operator scripts (QA seed,
        # livechat setup). They were never in this path, so they have been
        # passing-by-not-running since they were added — a seed-script
        # regression could ship green (GOL-2463).
        run: python3 -m pytest grove_headless/tests/ scripts/rate_check/tests/ scripts/tests/ grove_schedule_f/tests/ grove_calendar/tests/ -v

  validate-tenant-config:
    name: Validate Tenant Slug Map
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify tenant slug map is consistent
        run: |
          python3 - <<'PY'
          import ast, sys, pathlib
          src = pathlib.Path('grove_headless/models/website.py').read_text()
          tree = ast.parse(src)
          slug_map = None
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for t in node.targets:
                      if isinstance(t, ast.Name) and t.id == '_TENANT_SLUGS':
                          slug_map = ast.literal_eval(node.value)
          if not slug_map:
              sys.exit('_TENANT_SLUGS not found in website.py')
          required = {'goldberry', 'ggg', 'nursery'}
          missing = required - set(slug_map.keys())
          if missing:
              sys.exit(f'Missing required tenant slugs: {missing}')
          for slug, name in slug_map.items():
              if not name.strip():
                  sys.exit(f'Empty website name for slug "{slug}"')
          print(f'Tenant slugs valid: {slug_map}')
          PY

  validate-manifests:
    name: Validate Module Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Parse and validate __manifest__.py files
        run: |
          python3 - <<'PY'
          import ast, glob, sys
          manifests = glob.glob('*/__manifest__.py')
          if not manifests:
              sys.exit('No manifests found — repo layout changed?')
          fail = False
          for f in manifests:
              try:
                  data = ast.literal_eval(open(f).read())
                  for k in ('name', 'version', 'depends'):
                      if k not in data:
                          raise AssertionError(f'missing required key: {k}')
                  if not data.get('installable', True):
                      raise AssertionError('module is not installable')
                  if not data['version'].startswith('19.'):
                      raise AssertionError(f"version {data['version']} does not target Odoo 19")
                  print(f'  {f}: ok — {data["name"]} v{data["version"]}')
              except Exception as e:
                  print(f'  {f}: FAIL — {e}')
                  fail = True
          if fail:
              sys.exit(1)
          PY

  validate-xml-data-files:
    name: Validate XML data files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Parse all data XML files referenced in manifests
        run: |
          python3 - <<'PY'
          import ast, glob, sys, xml.etree.ElementTree as ET
          fail = False
          for manifest_path in glob.glob('*/__manifest__.py'):
              module_dir = manifest_path.rsplit('/', 1)[0]
              data = ast.literal_eval(open(manifest_path).read())
              for relpath in data.get('data', []):
                  full = f'{module_dir}/{relpath}'
                  if not relpath.endswith('.xml'):
                      continue
                  try:
                      ET.parse(full)
                      print(f'  {full}: ok')
                  except Exception as e:
                      print(f'  {full}: FAIL — {e}')
                      fail = True
          if fail:
              sys.exit(1)
          PY

  install-smoke-test:
    name: Install + test module against Odoo 19
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, validate-tenant-config, validate-manifests, validate-xml-data-files]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository into grove-odoo-modules/
        uses: actions/checkout@v4
        with:
          path: grove-odoo-modules

      - name: Clone OCA addons for grove_schedule_f
        run: |
          for repo in account-reconcile bank-statement-import account-financial-tools \
                      account-financial-reporting reporting-engine server-ux mis-builder; do
            git clone --depth 1 --branch 19.0 "https://github.com/OCA/${repo}.git" "oca/${repo}"
          done

      # --test-enable runs every Odoo test tagged at_install / post_install
      # during this init. --test-tags scopes execution to grove_headless
      # only (core Odoo's suite is enormous and irrelevant). log-level=info
      # surfaces individual test failures in the run log; log-level=warn
      # would swallow them — that's the one substantive deviation from
      # the simpler version on main.
      - name: Boot Odoo 19 with grove_headless installed and run unit tests
        id: boot
        run: |
          # --test-enable runs every test discovered under grove_headless/tests/.
          # --test-tags filters to only this module's suite (avoids pulling in
          # base Odoo's slow tests). post_install ensures data files are loaded
          # before tests look up seeded websites.
          docker run -d --name odoo \
            --network host \
            -v "$PWD/grove-odoo-modules:/mnt/extra-addons" \
            -v "$PWD/oca:/mnt/oca" \
            -e HOST=localhost \
            -e USER=odoo \
            -e PASSWORD=odoo \
            odoo:19 \
            -- --addons-path=/mnt/extra-addons,/mnt/oca/account-reconcile,/mnt/oca/bank-statement-import,/mnt/oca/account-financial-tools,/mnt/oca/account-financial-reporting,/mnt/oca/reporting-engine,/mnt/oca/server-ux,/mnt/oca/mis-builder,/usr/lib/python3/dist-packages/odoo/addons \
               --database=odoo \
               --without-demo=all \
               --init=grove_headless,grove_support,grove_schedule_f,grove_calendar \
               --test-enable \
               --test-tags='/grove_headless,/grove_support,/grove_schedule_f,/grove_calendar' \
               --stop-after-init \
               --log-level=info
          # GOL-3876: block until the container actually exits, instead of a
          # fixed ~5-min sleep cap. The suite now runs 4.5–5.5 min, so the old
          # cap was a coin flip: a PR run that finished the loop while Odoo was
          # still running went green regardless of results (ExitCode reads 0 for
          # a RUNNING container). `docker wait` blocks until the container stops
          # and prints its real exit code; `timeout 900` keeps the job bounded
          # (job timeout-minutes: 20 already covers 15 min + clone/pull). If the
          # wait times out, rc=timeout and the container is still running — the
          # Verify step's running-guard turns that into a red check.
          rc=$(timeout 900 docker wait odoo || echo timeout)
          echo "docker wait rc: $rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Verify exit status and surface logs on failure
        run: |
          logs=$(docker logs odoo 2>&1)
          # GOL-3876 (1): a container that is STILL RUNNING reports ExitCode 0.
          # The old gate trusted ExitCode and went green mid-suite whenever the
          # run outlasted the boot step's cap. Refuse to judge a running suite.
          running=$(docker inspect odoo --format '{{.State.Running}}')
          if [ "$running" = "true" ]; then
            echo "::error::Odoo still running after the wait cap — gate cannot judge the suite"
            echo "::group::Odoo logs"
            printf '%s\n' "$logs"
            echo "::endgroup::"
            exit 1
          fi
          status=$(docker inspect odoo --format '{{.State.ExitCode}}')
          echo "Odoo init+test exited: $status (docker wait rc: ${{ steps.boot.outputs.rc }})"
          # GOL-1941: without -d/--database, Odoo runs ZERO tests and still exits
          # 0 — the smoke-test was a silent no-op for its entire life (green !=
          # ran). Hard-fail if Odoo ever reports it skipped the suite, so this
          # gate can never again pass without actually running the tests.
          if grep -qiE "tests won't run|database not initialized" <<< "$logs"; then
            echo "::error::Odoo reported it would NOT run tests (missing database?). The grove_headless suite did not execute."
            echo "::group::Odoo logs"
            printf '%s\n' "$logs"
            echo "::endgroup::"
            exit 1
          fi
          # GOL-3876 (2): require the test-run summary line. Odoo logs
          # `odoo.tests.result: N failed, M error(s) of K tests` only after the
          # ENTIRE suite completes — its presence is proof the run finished, not
          # that a class merely started (class names are logged mid-run). A
          # green check that lacks this line was judged on a half-finished run.
          if ! grep -qE 'odoo\.tests\.result: [0-9]+ failed, [0-9]+ error' <<< "$logs"; then
            echo "::error::No test summary line — suite did not complete"
            echo "::group::Odoo logs"
            printf '%s\n' "$logs"
            echo "::endgroup::"
            exit 1
          fi
          # GOL-3876 (3): belt and braces — parse the summary and fail on any
          # failed/errored test even if ExitCode somehow reads 0.
          summary=$(grep -oE 'odoo\.tests\.result: [0-9]+ failed, [0-9]+ error' <<< "$logs" | tail -1)
          failed=$(grep -oE '[0-9]+ failed' <<< "$summary" | grep -oE '[0-9]+')
          errors=$(grep -oE '[0-9]+ error' <<< "$summary" | grep -oE '[0-9]+')
          failed=${failed:-0}
          errors=${errors:-0}
          echo "Test summary: ${failed} failed, ${errors} error(s)"
          if [ "$((failed + errors))" -gt 0 ]; then
            echo "::error::Odoo suite reported ${failed} failed, ${errors} error(s)"
            echo "::group::Odoo logs"
            printf '%s\n' "$logs"
            echo "::endgroup::"
            exit 1
          fi
          # Positive assertion: the suite must actually have executed at least one
          # grove_headless test class. Odoo logs each running class as
          # `odoo.addons.grove_headless.tests.<module>.<Class>`.
          if ! grep -qE "odoo\.addons\.grove_headless\.tests\." <<< "$logs"; then
            echo "::error::No grove_headless test class was executed — the suite is not being run."
            echo "::group::Odoo logs"
            printf '%s\n' "$logs"
            echo "::endgroup::"
            exit 1
          fi
          # GOL-2022: same positive assertion for grove_support — a green check
          # must never again hide a module whose suite silently never ran.
          if ! grep -qE "odoo\.addons\.grove_support\.tests\." <<< "$logs"; then
            echo "::error::No grove_support test class was executed — the suite is not being run."
            echo "::group::Odoo logs"
            printf '%s\n' "$logs"
            echo "::endgroup::"
            exit 1
          fi
          # GOL-3876 (4): grove_schedule_f is installed and tested but had no
          # positive assertion — add one so a silent skip of it is also caught.
          if ! grep -qE "odoo\.addons\.grove_schedule_f\.tests\." <<< "$logs"; then
            echo "::error::No grove_schedule_f test class was executed — the suite is not being run."
            echo "::group::Odoo logs"
            printf '%s\n' "$logs"
            echo "::endgroup::"
            exit 1
          fi
          # GOL-3830: same positive assertion for grove_calendar — a green check
          # must never again hide a module whose suite silently never ran.
          if ! grep -qE "odoo\.addons\.grove_calendar\.tests\." <<< "$logs"; then
            echo "::error::No grove_calendar test class was executed — the suite is not being run."
            echo "::group::Odoo logs"
            printf '%s\n' "$logs"
            echo "::endgroup::"
            exit 1
          fi
          # GOL-3876 (5): ExitCode check last — belt and braces; the summary
          # parse above is the authoritative pass/fail signal now.
          if [ "$status" != "0" ]; then
            echo "::group::Odoo logs"
            printf '%s\n' "$logs"
            echo "::endgroup::"
            exit 1
          fi
          # Surface the full run log (not just a grep) so a future silent-skip is
          # visible to reviewers rather than hidden behind a green check.
          echo "::group::Odoo test run log"
          printf '%s\n' "$logs"
          echo "::endgroup::"

  ci-scripts:
    # GOL-1919: run scripts/ci/*.test.mjs as a live gate. `scripts/` is not a
    # Node workspace, so nothing else runs these. The load-bearing test is
    # protected-paths-carveout.test.mjs, the behavioral test for the auto-approve
    # carve-out (scripts/ci/protected-paths-carveout.mjs) — the module that stops
    # the bot from auto-approving an agent PR that touches a sensitive path.
    # (GOL-2013 removed the protected-paths guard + its AgenticOS generator; the
    # carve-out is now a standalone, hand-maintained module.) node builtins only.
    name: CI scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run scripts/ci/*.test.mjs
        run: |
          shopt -s nullglob
          tests=(scripts/ci/*.test.mjs)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::no scripts/ci/*.test.mjs found — expected the protected-paths carve-out test"
            exit 1
          fi
          fail=0
          for f in "${tests[@]}"; do
            echo "::group::node $f"
            node "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail
