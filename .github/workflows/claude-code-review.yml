name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Docs-only PRs don't need an agentic review; everything else does.
    paths-ignore:
      - "**.md"

# Each review costs a full Claude Code session (~2-6 min of Max-subscription
# capacity). `synchronize` re-reviews on every push, so rapid pushes stacked
# reviews of already-obsolete intermediate states — cancel the stale one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Preflight: is the review credential actually available to THIS run?
  #
  # Without it the action authenticates with an empty token and exits 1, so an
  # unconfigured (or Dependabot-scoped) repo paints a red X on every single PR —
  # which trains everyone to ignore red, the opposite of what a review lane is
  # for. Two real cases produce an empty token here:
  #   1. the repo (or org->repo grant) simply doesn't have the secret yet, and
  #   2. Dependabot runs, which read GitHub's ISOLATED Dependabot secret store —
  #      the caveat already documented on allowed_bots below.
  # A secret can't be tested in a job-level `if:`, so it's read into a step here
  # and surfaced as an output — the same preflight shape this org already uses
  # for dependency-review.
  preflight:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        env:
          # Never echoed — only its emptiness is tested.
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "${CLAUDE_TOKEN}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::CLAUDE_CODE_OAUTH_TOKEN is not available to this run, so the agentic review was skipped (the PR is NOT unreviewed-by-policy, it simply could not run). Set it with 'gh secret set CLAUDE_CODE_OAUTH_TOKEN -R ${{ github.repository }}' — and additionally '--app dependabot' for Dependabot PRs."
          fi

  claude-review:
    # Drafts get reviewed when marked ready (ready_for_review trigger above).
    # Skipped (neutral, not failed) when the credential is absent — see preflight.
    needs: preflight
    if: github.event.pull_request.draft == false && needs.preflight.outputs.has_token == 'true'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # SHA-pinned (third-party action with id-token: write; `@v1` is a mutable
        # major-version tag). Pinned to the immutable commit — same pin as
        # grove-sites' claude-code-review.yml. Renovate/Dependabot drive bumps.
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1 (2025-08-26)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Paperclip agents open PRs as the AgenticOS GitHub App; the action
          # rejects non-human actors by default ("Workflow initiated by
          # non-human actor"). Allow our App bot (agent-authored PRs need this
          # review MORE than human ones — D4 review-lane design; GOL-1186) and
          # Dependabot so dependency-bump PRs get reviewed too. The action
          # normalizes each entry (lowercase, strips `[bot]`) before matching.
          # NOTE: Dependabot runs use GitHub's isolated Dependabot secret store,
          # so CLAUDE_CODE_OAUTH_TOKEN must ALSO be set there
          # (`gh secret set CLAUDE_CODE_OAUTH_TOKEN --app dependabot`) or the
          # action gets an empty token and fails to authenticate.
          allowed_bots: 'agenticos-developer,dependabot[bot]'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
