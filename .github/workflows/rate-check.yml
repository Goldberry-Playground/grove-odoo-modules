name: rate-check
on:
  schedule:
    - cron: "0 11 * * *"   # 07:00 ET daily (design: vault Grove Shipping)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print drift only; do not open a PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write  # gh workflow run ci.yml -- self-dispatch the required checks (GOL-2114)

jobs:
  rate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ops-alerting preflight
        # GOL-2642: the Discord alerts below fail SILENTLY when their secret is
        # absent — every Discord step short-circuits. Until now that short-circuit logged
        # `::notice::`, which does NOT surface in the run summary, so the alerting
        # layer for a MONEY-PATH signal ("rates drifted", "regenerated table failed
        # its invariants", "the quote source is gone") was itself invisible: the
        # step ran, printed a notice nobody sees, and reported success.
        # Report a missing secret as a `::warning::` + a run-summary line instead,
        # and NEVER fail on it: a missing ops secret must not take down the rate
        # check itself. Emptiness is all we test — no secret value is ever echoed,
        # and the warning self-clears the moment the secret is provisioned.
        # (This preflight used to also test for a PR-identity PAT; that secret
        # is gone -- GOL-2114 is closed by the `Self-dispatch required checks`
        # step below, not by a token. Josh, GOL-2116: do not provision one.)
        env:
          HAS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK_URL != '' }}
        run: |
          if [ "$HAS_WEBHOOK" != "true" ]; then
            echo "::warning title=No Discord ops webhook::DISCORD_OPS_WEBHOOK_URL is not set in this repo - every rate-check Discord alert (drift / invariants-failed / run-failure) is a silent no-op. See scripts/rate_check/RUNBOOK.md, GOL-2642."
            echo "- :warning: **DISCORD_OPS_WEBHOOK_URL is missing** - rate-drift, invariant-failure and run-failure Discord alerts are no-ops (GOL-2642)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ops alerting fully configured (Discord webhook present)"
          fi
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        # Checks out with the default `github.token` on purpose (GOL-2114): the
        # later `git push -f origin chore/rate-check` is therefore a GITHUB_TOKEN
        # push, whose `synchronize` event GitHub suppresses (anti-recursion).
        # That is fine -- the required checks are started by the explicit
        # `Self-dispatch required checks` step below, not by the push.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Rate table freshness (report)
        id: freshness
        # GOL-2646 / GOL-2641: "can we reach a quote source right now" (the probe
        # below) and "how old are the numbers we bill off" are DIFFERENT alarms.
        # While a quote source is unavailable (GOL-2605) the probe is red EVERY
        # morning and carries no new information, so a genuinely fossilizing rate
        # table would hide inside a wall of identical failures. This guard needs no
        # network and no secret, so it runs FIRST — before the probe can exit early
        # — and it deliberately does NOT decide the job here: it only records a
        # verdict that the final "enforce" step re-asserts. That leaves the probe's
        # own exit code, its PR, and its alerts byte-for-byte as they are today.
        run: |
          set +e
          out=$(python3 scripts/rate_check/staleness.py 2>&1)
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # staleness.py emits its own ::warning:: / ::error:: prefix, so echoing the
          # line verbatim is what puts the dated verdict on the run summary.
          printf '%s\n' "$out"
          {
            echo "### Rate table freshness"
            echo ""
            printf '%s\n' "$out" | sed 's/^::[a-z]*:://'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run rate-checker
        id: check
        run: |
          # GOL-2270: Pirate Ship is the rate source now. Its rate calculator is
          # public (no auth), so the old "skip until SHIPPO_API_KEY exists" guard
          # step is gone — the checker always runs.
          pip install --quiet requests
          set +e
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/rate_check/rate_check.py --dry-run
          else
            python3 scripts/rate_check/rate_check.py
          fi
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi
      - name: Validate regenerated rate table (self-gate before proposing a merge)
        # GOL-2212: the bot regenerates shipping_rates.json from a live Pirate Ship probe,
        # so its output is NEW data every morning and can trip a rate-table invariant
        # (a new box id, a monotonicity edge, a shape change). The merge queue only
        # *requires* Lint Python / Validate Module Manifests / Validate Tenant Slug
        # Map — NOT the rate-table invariants, which live in the "Pure-Python unit
        # tests" job that is board-PARKED for required-promotion (GOL-1953 / GOL-2015,
        # paused 2026-09-01). Because those invariants are non-required, a rate-check
        # PR could be approved + enqueued before/regardless of them and merge RED rate
        # data to the live-pricing money path — exactly what reddened main via #194.
        # Run that SAME pure-python suite here so the bot gates its OWN output: a pass
        # opens a mergeable (ready) PR that still merges unattended; a failure opens/
        # keeps the PR as a DRAFT — GitHub blocks merging a draft, so no automated
        # approver and no merge-queue entry can push bad rates to main. Odoo-level
        # invariants ("Install + test module against Odoo 19") still run as PR CI;
        # this covers the pure-python invariants the bot can reproduce standalone.
        if: steps.check.outputs.code == '3'
        id: invariants
        run: |
          pip install --quiet pytest requests
          set +e
          python3 -m pytest grove_headless/tests/ scripts/rate_check/tests/ -q
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "::notice::rate-table invariants PASS — PR will be opened ready to merge"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::rate-table invariants FAIL (pytest exit $rc) — PR will be held as a DRAFT for human review, never auto-merged"
          fi
      - name: Open / refresh rates PR
        if: steps.check.outputs.code == '3'
        env:
          # GOL-2114: the PR is opened/edited with the default token, so its
          # author stays `github-actions[bot]`. auto-approve.yml classifies by
          # author, and that identity is what keeps the HUMAN review gate on a
          # money-adjacent rate change (an agent-App author would auto-merge it).
          # The `opened`/`synchronize` events this token produces do not start
          # the required checks; the self-dispatch step below does.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GOL-2212: "false" when the regenerated table failed the invariants above.
          INVARIANTS_OK: ${{ steps.invariants.outputs.ok }}
        run: |
          git config user.name "grove-rate-check[bot]"
          git config user.email "noreply@goldberrygrove.farm"
          git checkout -B chore/rate-check
          git add grove_headless/data/shipping_rates.json
          git commit -m "chore(rates): morning rate-check $(date -u +%F) — Pirate Ship-derived zone rates"
          git push -f origin chore/rate-check
          # GOL-2212: red invariants => open/keep the PR as a DRAFT so it can never be
          # merged unattended; green => (mark) ready so the daily cadence still merges.
          if [ "$INVARIANTS_OK" = "false" ]; then DRAFT_FLAG="--draft"; else DRAFT_FLAG=""; fi
          if gh pr create --title "Rate check: shipping zone rates drifted >= \$1" \
                --body-file scripts/rate_check/out/summary.md \
                --base main --head chore/rate-check $DRAFT_FLAG 2>/dev/null; then
            echo "::notice::opened rate-check PR (draft=${INVARIANTS_OK:+$([ "$INVARIANTS_OK" = false ] && echo true || echo false)})"
          else
            # PR already exists on chore/rate-check: refresh its body and re-assert the
            # correct draft/ready state for today's regenerated data.
            gh pr edit chore/rate-check --body-file scripts/rate_check/out/summary.md
            if [ "$INVARIANTS_OK" = "false" ]; then
              gh pr ready chore/rate-check --undo || true
            else
              gh pr ready chore/rate-check || true
            fi
          fi
          # ── Second layer, from #209 (GOL-2212) — keep BOTH ──────────────────
          # These close different holes and neither subsumes the other:
          #   this branch  = fail-closed at PR CREATION (draft-on-red), so bad
          #                  rates cannot be merged even by a path that ignores
          #                  the non-required pure-python invariants;
          #   #209 (below) = fix the auto-merge ARMING lifecycle, so yesterday's
          #                  arming cannot merge today's force-pushed head.
          # Runs after the create/edit above because it needs the PR to exist.
          # Disarm auto-merge left armed by a PREVIOUS day's auto-approve run.
          # GitHub auto-merge survives the force-push above, so yesterday's
          # arming would merge TODAY's untested rates the moment the (minimal)
          # required contexts go green — before "Pure-Python unit tests" or the
          # Odoo install smoke test report. That is exactly how the 2026-09-08
          # run (#194) landed a broken shipping_rates.json on main (#204).
          # auto-approve.yml re-arms only after the FULL CI suite is green on
          # this new head SHA. Disarming is NOT the GOL-1658 branch-delete trap:
          # it only clears the flag, never closes the PR.
          gh pr merge chore/rate-check --disable-auto 2>/dev/null \
            || echo "::notice::auto-merge was not armed on chore/rate-check (nothing to disarm)"
      - name: Self-dispatch required checks
        # GOL-2114 (pattern ported from odoocker GOL-2504, #728 + #2519): every
        # event the push + PR-create above produce comes from GITHUB_TOKEN, and
        # GitHub never starts `on: pull_request` / `on: push` workflows for those
        # (anti-recursion). So the five required contexts (Lint Python, Validate
        # Module Manifests, Validate Tenant Slug Map, Pure-Python unit tests,
        # Install + test module against Odoo 19) were created `action_required`
        # and the PR wedged at "Expected -- waiting for status" every morning until
        # a human pushed an empty re-trigger commit (GOL-2113 #180, GOL-2314 #238,
        # GOL-2397 #249, GOL-2606 #281 -- one agent heartbeat each).
        # `workflow_dispatch` is the documented EXCEPTION to that rule, and a
        # dispatched ci.yml run at the chore/rate-check ref reports its check-runs
        # on the very same head SHA the PR points at, so the context names satisfy
        # the ruleset. No PAT, no App secret: `actions: write` on the ambient token
        # is all `gh workflow run` needs.
        # Fail SOFT: the PR is already pushed and open; a failed dispatch only
        # costs a reviewer the manual re-run that was the status quo, and the
        # merge queue's `merge_group` path re-runs the same checks regardless.
        if: steps.check.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh workflow run ci.yml --ref chore/rate-check; then
            echo "dispatched ci.yml @ chore/rate-check"
            echo "- Required checks self-dispatched: ci.yml @ chore/rate-check (GOL-2114)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Required checks NOT dispatched::could not dispatch ci.yml at chore/rate-check - the rates PR will sit at action_required until the checks are re-run by hand (gh workflow run ci.yml --ref chore/rate-check) or the merge queue runs them. GOL-2114."
            echo "- :warning: **Required checks NOT self-dispatched** - re-run ci.yml at chore/rate-check by hand (GOL-2114)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Discord alert
        if: steps.check.outputs.code == '3'
        env:
          WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
          # GOL-2212: surface when the PR was held as a draft (invariants red) so ops
          # knows a human must look — a held PR will NOT merge on its own.
          INVARIANTS_OK: ${{ steps.invariants.outputs.ok }}
        run: |
          # GOL-2642: fail LOUD-but-green when the webhook is missing. A `::notice::`
          # here was invisible in the run summary, so a drifted-rates alert that was
          # never delivered looked identical to one that was.
          if [ -z "$WEBHOOK" ]; then
            echo "::warning title=Rate-drift alert NOT delivered::Shipping rates drifted and a PR was opened, but DISCORD_OPS_WEBHOOK_URL is not configured - no Discord alert was sent. GOL-2642."
            echo "- :warning: **Rate-drift Discord alert NOT sent** - no DISCORD_OPS_WEBHOOK_URL in this repo (GOL-2642). Review the rate-check PR manually." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          body=$(head -c 1800 scripts/rate_check/out/summary.md)
          # NB: \$1 is a literal dollar amount (double quotes → escaped $ stays literal); keep it escaped so shellcheck (SC2016) stays clean.
          if [ "$INVARIANTS_OK" = "false" ]; then
            header="⚠️ **Shipping rates drifted ≥ \$1 but the regenerated table FAILED its invariants** — PR held as a DRAFT (will NOT auto-merge); a human must review before it can ship"
          else
            header="📦 **Shipping rates drifted ≥ \$1** — review the rate-check PR"
          fi
          payload=$(python3 -c "import json,sys;print(json.dumps({'content':sys.argv[1]+'\n'+sys.argv[2]}))" "$header" "$body")
          curl -sS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
      - name: Discord failure alert
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
        run: |
          # GOL-2642: see the drift alert above - a missing webhook must be visible,
          # and this step is the one that fires when the quote source is gone.
          if [ -z "$WEBHOOK" ]; then
            echo "::warning title=Rate-check failure alert NOT delivered::rate-check FAILED and rates were not updated, but DISCORD_OPS_WEBHOOK_URL is not configured - no Discord alert was sent. GOL-2642."
            echo "- :warning: **rate-check failure Discord alert NOT sent** - no DISCORD_OPS_WEBHOOK_URL in this repo (GOL-2642). Rates were NOT updated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          payload=$(python3 -c "import json;print(json.dumps({'content':'⚠️ rate-check failed — Pirate Ship quote error or workflow fault; rates NOT updated'}))")
          curl -sS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
      - name: Rate table freshness (enforce)
        # Runs LAST and always(), both on purpose:
        #   * LAST, because every step above carries an implicit `success() && …`
        #     in its `if:` — failing earlier would SKIP the drift PR and the drift
        #     Discord alert, and a table can be stale and drifted on the same day.
        #   * always(), because the probe above is red while the quote source is
        #     closed, which would otherwise skip the freshness verdict entirely.
        # Escalation for a red verdict is the CI failure router (red job → GitHub
        # issue → Paperclip), NOT Discord: DISCORD_OPS_WEBHOOK_URL does not exist in
        # this repo (GOL-2642), so every Discord step here short-circuits to a no-op.
        if: always()
        env:
          # Empty when the report step never ran (cancelled job, failed checkout) —
          # that lands in the catch-all below and reads as BROKEN, never as fresh.
          RC: ${{ steps.freshness.outputs.rc }}
        run: |
          case "$RC" in
            0)
              echo "::notice::rate-table freshness OK — see the 'Rate table freshness (report)' step for the dated verdict"
              ;;
            1)
              echo "::error::rate table is STALE or UNSTAMPED — failing the run so the CI failure router files it (GOL-2646). Refresh via scripts/rate_check/RUNBOOK.md -> 'Refreshing the table without a quote source'"
              exit 1
              ;;
            *)
              echo "::error::rate-table freshness guard did not run (exit '$RC') — treating as BROKEN, not as fresh"
              exit 1
              ;;
          esac
