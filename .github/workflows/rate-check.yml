name: rate-check
on:
  schedule:
    - cron: "0 11 * * *"   # 07:00 ET daily (design: vault Grove Shipping)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print drift only; do not open a PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  rate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # GOL-2114: persist a NON-GITHUB_TOKEN identity so the later
          # `git push` to chore/rate-check fires a `synchronize` event that
          # actually triggers the required checks. Pushes made with the default
          # GITHUB_TOKEN are suppressed by GitHub's anti-recursion rule, so the
          # PR wedges at "action_required" every morning until a human/App pushes
          # an empty re-trigger commit. RATE_CHECK_PR_TOKEN is a purpose-scoped
          # token (contents:write + pull_requests:write on THIS repo only).
          # Falls back to the default token when unset → no regression, but the
          # daily wedge persists until the secret is provisioned (see runbook).
          token: ${{ secrets.RATE_CHECK_PR_TOKEN || github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Guard — skip cleanly until SHIPPO_API_KEY exists
        id: guard
        env:
          SHIPPO_API_KEY: ${{ secrets.SHIPPO_API_KEY }}
        run: |
          if [ -z "$SHIPPO_API_KEY" ]; then
            echo "::notice::SHIPPO_API_KEY not configured yet — rate-check skipped (TODO: Josh creates the Shippo account)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run rate-checker
        if: steps.guard.outputs.skip == 'false'
        id: check
        env:
          SHIPPO_API_KEY: ${{ secrets.SHIPPO_API_KEY }}
        run: |
          pip install --quiet requests
          set +e
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/rate_check/rate_check.py --dry-run
          else
            python3 scripts/rate_check/rate_check.py
          fi
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi
      - name: Validate regenerated rate table (self-gate before proposing a merge)
        # GOL-2212: the bot regenerates shipping_rates.json from a live Shippo probe,
        # so its output is NEW data every morning and can trip a rate-table invariant
        # (a new box id, a monotonicity edge, a shape change). The merge queue only
        # *requires* Lint Python / Validate Module Manifests / Validate Tenant Slug
        # Map — NOT the rate-table invariants, which live in the "Pure-Python unit
        # tests" job that is board-PARKED for required-promotion (GOL-1953 / GOL-2015,
        # paused 2026-09-01). Because those invariants are non-required, a rate-check
        # PR could be approved + enqueued before/regardless of them and merge RED rate
        # data to the live-pricing money path — exactly what reddened main via #194.
        # Run that SAME pure-python suite here so the bot gates its OWN output: a pass
        # opens a mergeable (ready) PR that still merges unattended; a failure opens/
        # keeps the PR as a DRAFT — GitHub blocks merging a draft, so no automated
        # approver and no merge-queue entry can push bad rates to main. Odoo-level
        # invariants ("Install + test module against Odoo 19") still run as PR CI;
        # this covers the pure-python invariants the bot can reproduce standalone.
        if: steps.guard.outputs.skip == 'false' && steps.check.outputs.code == '3'
        id: invariants
        run: |
          pip install --quiet pytest requests
          set +e
          python3 -m pytest grove_headless/tests/ scripts/rate_check/tests/ -q
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "::notice::rate-table invariants PASS — PR will be opened ready to merge"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::rate-table invariants FAIL (pytest exit $rc) — PR will be held as a DRAFT for human review, never auto-merged"
          fi
      - name: Open / refresh rates PR
        if: steps.guard.outputs.skip == 'false' && steps.check.outputs.code == '3'
        env:
          # GOL-2114: open/edit the PR under a non-GITHUB_TOKEN identity so the
          # `opened` event triggers required checks (Lint Python, Validate Module
          # Manifests, Validate Tenant Slug Map, …). Same token as checkout above
          # so push + PR-create both come from the bot identity. Falls back to the
          # default token when unset (current behaviour — checks stay wedged).
          GH_TOKEN: ${{ secrets.RATE_CHECK_PR_TOKEN || secrets.GITHUB_TOKEN }}
          # GOL-2212: "false" when the regenerated table failed the invariants above.
          INVARIANTS_OK: ${{ steps.invariants.outputs.ok }}
        run: |
          git config user.name "grove-rate-check[bot]"
          git config user.email "noreply@goldberrygrove.farm"
          git checkout -B chore/rate-check
          git add grove_headless/data/shipping_rates.json
          git commit -m "chore(rates): morning rate-check $(date -u +%F) — Shippo-derived zone rates"
          git push -f origin chore/rate-check
          # GOL-2212: red invariants => open/keep the PR as a DRAFT so it can never be
          # merged unattended; green => (mark) ready so the daily cadence still merges.
          if [ "$INVARIANTS_OK" = "false" ]; then DRAFT_FLAG="--draft"; else DRAFT_FLAG=""; fi
          if gh pr create --title "Rate check: shipping zone rates drifted >= \$1" \
                --body-file scripts/rate_check/out/summary.md \
                --base main --head chore/rate-check $DRAFT_FLAG 2>/dev/null; then
            echo "::notice::opened rate-check PR (draft=${INVARIANTS_OK:+$([ "$INVARIANTS_OK" = false ] && echo true || echo false)})"
          else
            # PR already exists on chore/rate-check: refresh its body and re-assert the
            # correct draft/ready state for today's regenerated data.
            gh pr edit chore/rate-check --body-file scripts/rate_check/out/summary.md
            if [ "$INVARIANTS_OK" = "false" ]; then
              gh pr ready chore/rate-check --undo || true
            else
              gh pr ready chore/rate-check || true
            fi
          fi
      - name: Discord alert
        if: steps.guard.outputs.skip == 'false' && steps.check.outputs.code == '3'
        env:
          WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
          # GOL-2212: surface when the PR was held as a draft (invariants red) so ops
          # knows a human must look — a held PR will NOT merge on its own.
          INVARIANTS_OK: ${{ steps.invariants.outputs.ok }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "::notice::no Discord webhook configured"; exit 0; }
          body=$(head -c 1800 scripts/rate_check/out/summary.md)
          if [ "$INVARIANTS_OK" = "false" ]; then
            header='⚠️ **Shipping rates drifted ≥ \$1 but the regenerated table FAILED its invariants** — PR held as a DRAFT (will NOT auto-merge); a human must review before it can ship'
          else
            header='📦 **Shipping rates drifted ≥ \$1** — review the rate-check PR'
          fi
          payload=$(python3 -c "import json,sys;print(json.dumps({'content':sys.argv[1]+'\n'+sys.argv[2]}))" "$header" "$body")
          curl -sS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
      - name: Discord failure alert
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "::notice::no Discord webhook configured"; exit 0; }
          payload=$(python3 -c "import json;print(json.dumps({'content':'⚠️ rate-check failed — Shippo quote error or workflow fault; rates NOT updated'}))")
          curl -sS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
